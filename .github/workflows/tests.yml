name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dependency-free unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate notebook JSON
        run: python -c "import json; json.load(open('notebooks/qwenapi_demo.ipynb', encoding='utf-8'))"
