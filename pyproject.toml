[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenapi-llmops"
version = "0.1.0"
description = "Reviewable Qwen serving, grounding policy, and search gateway components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
